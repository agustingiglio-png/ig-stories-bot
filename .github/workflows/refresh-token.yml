name: refresh-token

# El token long-lived de Instagram dura ~60 dias. Este workflow lo refresca
# cada semana y reescribe el Secret IG_ACCESS_TOKEN, asi nunca expira sin que
# tengas que hacer nada. (Requiere un Secret extra: GH_PAT, ver README.)
on:
  schedule:
    - cron: "0 6 * * 1"      # lunes 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh long-lived token
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        run: |
          OUT=$(python manage.py refresh-token --force)
          NEW=$(echo "$OUT" | grep '^NUEVO_TOKEN=' | cut -d= -f2-)
          if [ -n "$NEW" ]; then
            echo "::add-mask::$NEW"
            echo "new_token=$NEW" >> "$GITHUB_OUTPUT"
          fi

      - name: Update secret IG_ACCESS_TOKEN
        if: steps.refresh.outputs.new_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}       # PAT con permiso de secrets (ver README)
        run: |
          echo -n "${{ steps.refresh.outputs.new_token }}" | gh secret set IG_ACCESS_TOKEN
          echo "Secret IG_ACCESS_TOKEN actualizado."
